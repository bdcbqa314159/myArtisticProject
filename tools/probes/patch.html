<meta charset=utf-8><body style=margin:0><p id=o>no verdict</p><script>
const out = []; let done = 0;
/* 2400x2000 is here for the photograph's own pixels: a 2000px copy
 * on a wider screen would be enlarged, and nothing below this size
 * can show that. */
const SIZES = [[390, 720], [1400, 900], [2400, 2000]];
SIZES.forEach(([w, h]) => {
  const f = document.createElement("iframe");
  f.width = w; f.height = h; f.style.border = 0; f.src = "/";
  document.body.appendChild(f);
  f.addEventListener("load", () => setTimeout(() => {
    try {
      const d = f.contentDocument;
      // The reveal released at once: its transform is the containing
      // block for the fixed front, and mid-flight it reads as a box
      // inside the card instead of the screen.
      d.querySelectorAll(".reveal").forEach((e) => {
        e.style.transition = "none";
        e.classList.add("in");
      });
      const g = d.querySelector("details.group");
      g.open = true;
      setTimeout(() => {
        const fr = g.querySelector(".fridge.front").getBoundingClientRect();
        const support = g.querySelector(".fridge.front > .slot-1 img");
        const im = support.getBoundingClientRect();
        out.push(w + ":wide=" + Math.round(100 * fr.width / w)
          + ":tall=" + Math.round(100 * fr.height / h)
          // The photograph must BE the patchwork's box. On the card the
          // slot is an <li> with the image as its child; at the front a
          // <summary> sits between them and a percentage height dies on
          // it, leaving the photograph at its own 3:2 at the top.
          + ":fills=" + ((Math.abs(im.width - fr.width) < 3
                       && Math.abs(im.height - fr.height) < 3) ? "y" : "n")
          + ":img=" + Math.round(im.width) + "x" + Math.round(im.height)
          /* AND HOW MANY PIXELS THERE ACTUALLY ARE. The box filling the
           * screen says nothing about the photograph in it: the card's
           * copy is 900px wide, and stretched over a 1400px screen it
           * is soft. Opening swaps in a bigger one, and `naturalWidth`
           * is the only honest way to ask whether that happened — the
           * URL is a content hash and says nothing. */
          + ":natural=" + support.naturalWidth
          + ":waiting=" + (support.closest("summary").dataset.big ? "y" : "n"));

        /* AND THE PICTURES, one level further in.
         *
         * Every slide should be the same box — the screen, less the
         * band — so the strip does not jump as it is swiped. The
         * picture inside is fitted by `object-fit`, so the element's
         * rect is the SLIDE and not the photograph: the ink has to be
         * worked out from the box and the natural size, which is also
         * the only way to tell whether anything is being enlarged. */
        const shots = g.querySelector("details.shots");
        shots.open = true;
        setTimeout(() => {
          const reel = shots.querySelector(".reel");
          const rb = reel.getBoundingClientRect();

          /* TWO BOXES, AND THEY ARE NOT THE SAME QUESTION. The slide is
           * the screen — every one identical, or the strip jumps as it
           * is swiped. The photograph inside it is its own shape, as
           * large as the slide allows and never larger than its own
           * pixels, and the hairline is drawn on THAT. */
          const slides = [...reel.querySelectorAll(".slide")].map((s) => {
            const b = s.getBoundingClientRect();
            return Math.round(b.width) + "x" + Math.round(b.height);
          });
          const pictures = [...reel.querySelectorAll("img")].map((im) => {
            const b = im.getBoundingClientRect();
            return {
              wide: Math.round(b.width),
              tall: Math.round(b.height),
              top: Math.round(b.top - rb.top),
              bottom: Math.round(rb.bottom - b.bottom),
              enlarged: b.width > im.naturalWidth * 1.02,
              atPixels: b.width >= im.naturalWidth * 0.98,
              edge: parseFloat(f.contentWindow.getComputedStyle(im).borderTopWidth),
              /* The white mount. A carousel opened from the background
               * had none, because the prints were getting theirs by
               * sitting inside a print's slot. */
              mount: f.contentWindow.getComputedStyle(im).outlineStyle === "none"
                ? 0 : parseFloat(f.contentWindow.getComputedStyle(im).outlineWidth),
            };
          });
          /* WHERE IT COMES TO REST. A carousel freshly opened should
           * be at its start with the first photograph in the middle of
           * the screen. It was not: the snap alignment was on the
           * photograph rather than on the slide, so the strip settled
           * with the picture hard against the left edge. */
          const first = reel.querySelector("img").getBoundingClientRect();
          const offCentre = Math.round(Math.abs((first.left - rb.left)
                                                - (rb.right - first.right)));
          const boxes = [...new Set(slides)];
          out.push(w + ":slides=" + boxes.join(",")
            + ":shapes=" + pictures.length
            + ":band=" + Math.min(...pictures.map((p) => Math.min(p.top, p.bottom)))
            + ":enlarged=" + (pictures.some((p) => p.enlarged) ? "y" : "n")
            + ":framed=" + (pictures.every((p) => p.edge >= 1) ? "y" : "n")
            + ":mounted=" + (pictures.every((p) => p.mount >= 3) ? "y" : "n")
            /* THE SAME SIZE AS EACH OTHER. One horizon: every
             * photograph in a project shares a height, whichever way
             * round its own shape is. */
            + ":heights=" + [...new Set(pictures.map((p) => p.tall))].join(",")
            + ":of=" + Math.round(100 * Math.max(...pictures.map(
                (p) => p.wide / (rb.width || 1))))
            /* The one honest reason a photograph does not fill its
             * slide: it has run out of its own pixels. */
            + ":atpixels=" + (pictures.some((p) => p.atPixels) ? "y" : "n")
            + ":offcentre=" + offCentre
            + ":restsat=" + Math.round(reel.scrollLeft));
          if (++done === SIZES.length) say(out.join(" "));
        }, 1200);
      }, 1200);
    } catch (err) {
      out.push(w + ":threw-" + String(err.message).replace(/[^A-Za-z0-9]+/g, "-"));
      if (++done === SIZES.length) say(out.join(" "));
    }
  }, 1300));
});
function say(s) { document.getElementById("o").textContent = "PATCH " + s; }
</script>
