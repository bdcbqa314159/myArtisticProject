<meta charset=utf-8><body style=margin:0><p id=o>no verdict</p><script>
const f = document.createElement("iframe");
f.width = 390; f.height = 700; f.style.border = 0; f.src = "/";
document.body.appendChild(f);
f.addEventListener("load", () => setTimeout(() => {
  try {
    const d = f.contentDocument, w = f.contentWindow;
    const root = d.documentElement;
    const bar = d.querySelector("header");
    const veil = d.querySelector(".veil");
    const link = d.querySelector('.links a[href$="#about"]');
    const btn = d.querySelector(".hero .btn.primary");
    /* The logo takes you back to the top, and used to do it by
     * travelling the whole page — the longest journey on the site. It
     * crosses now like everything else. */
    const logo = d.querySelector("a.logo");
    if (!veil || !link || !btn || !logo) { say("missing"); return; }

    const inert = w.getComputedStyle(veil).pointerEvents === "none" ? "y" : "n";
    const about = d.getElementById("about");
    const want = Math.round(w.scrollY + about.getBoundingClientRect().top
                            - bar.getBoundingClientRect().height);
    link.click();
    setTimeout(() => {
      const during = root.classList.contains("crossing") ? "y" : "n";
      const landed = Math.abs(w.scrollY - want) <= 2 ? "y" : "n";
      setTimeout(() => {
        const after = root.classList.contains("crossing") ? "y" : "n";
        const held = Math.abs(w.scrollY - want) <= 2 ? "y" : "n";
        w.scrollTo({ top: 0, behavior: "instant" });
        setTimeout(() => {
          btn.click();
          setTimeout(() => {
            /* THE HERO BUTTON CROSSES TOO, which is the opposite of
             * what this used to prove. It travelled — an eased journey
             * of up to 1100ms — and a travelling link cannot arrive in
             * this browser at all, because the animation needs frames
             * an iframe never runs. So "it moved" is itself the
             * evidence: under the old rule the page would still be at
             * the top here. */
            const btnCrossed = root.classList.contains("crossing")
                               || w.scrollY > 2 ? "y" : "n";
            w.scrollTo({ top: 4000, behavior: "instant" });
            setTimeout(() => {
              logo.click();
              setTimeout(() => {
                /* Back to the top, from deep in the page: the journey
                 * the client singled out. Crossing, it is there. */
                const logoCrossed = root.classList.contains("crossing")
                                    || w.scrollY < 4000 ? "y" : "n";
                const atTop = w.scrollY <= 2 ? "y" : "n";
                say("inert=" + inert + " during=" + during + " landed=" + landed
                  + " after=" + after + " held=" + held + " btn=" + btnCrossed
                  + " logo=" + logoCrossed + " top=" + atTop
                  + " want=" + want);
              }, 900);
            }, 100);
          }, 500);
        }, 100);
      }, 640);
    }, 330);
  } catch (err) { say("threw-" + String(err.message).replace(/[^A-Za-z0-9]+/g, "-")); }
}, 900));
function say(s) { document.getElementById("o").textContent = "CROSS " + s; }
</script>
