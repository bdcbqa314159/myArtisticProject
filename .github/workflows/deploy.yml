name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every action is pinned to a COMMIT, not a tag.
#
# A tag is a label someone can move. These jobs hold `pages: write` and
# `id-token: write`, so an action that changed under its tag would be
# running with permission to publish this site — and the first anyone
# would know is a deployment nobody asked for.
#
# The `# v4` after each hash is for humans deciding whether to update;
# it has no effect on what runs. To update one, resolve the tag to its
# commit again rather than writing the tag back.

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # runs on every PR and every push. The required status check.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ./tools/js-is-current.sh        # the committed JS matches src/
      - run: node tools/words-check.mjs      # a headline survives being split
      - run: node tools/drift-check.mjs      # the parallax arithmetic holds
      - run: node tools/scroll-check.mjs     # the scroll is clamped and eased
      - run: python3 tools/icons.py          # favicon, touch icon, share image
      - run: python3 tools/vcard.py          # the saveable contact, or nothing at all
      - run: python3 tools/objects.py        # every content object is well formed
      - run: python3 tools/content-check.py  # the client's publication rules hold
      - run: python3 tools/objects-check.py  # the object checker itself still bites
      - run: python3 tools/fr-check.py       # the French page has the English page's shape
      - run: python3 tools/translate-check.py # the DeepL tool, against its own fake server
      - run: node tools/contact-check.mjs    # the form refuses what it must
      # poppler is what reads a PDF and turns its pages into images. The
      # BUILD does not need it — the pages are made once, on the machine
      # where the document was dropped, and committed like any other
      # picture. Only the checker needs it, to prove a forgery is still
      # refused.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: python3 tools/dossier-check.py  # a PDF is judged by what is inside it
      - run: python3 tools/invariants.py     # nothing that must happen once happens twice
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: zola@0.23.6
      - run: zola build
      # After the build, because it reads what was built. This is the
      # check that catches an inline script whose hash no longer matches
      # the policy — which happens every time one is edited, and which
      # the browser answers by refusing to run it at all.
      - run: python3 tools/csp-check.py      # every inline script is named by the policy

      # The only check here that runs the page rather than reading it.
      # Uses the runner's own Chrome — no dependency, nothing installed.
      - run: python3 tools/render-check.py

      # The pictures it took, kept for review. A layout cannot be checked
      # by reading it, and whoever is reviewing may have no browser to
      # run — `gh run download` fetches these.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: render-shots
          path: render-shots/
          retention-days: 7

      # only the real deploy publishes an artifact — a PR build that
      # uploaded one would contend with an in-flight deploy
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.event_name != 'pull_request'
        with:
          path: public

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # scoped to this job, and never cancelled: killing a deploy
    # mid-flight leaves Pages serving stale output
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
