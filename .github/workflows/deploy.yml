name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # runs on every PR and every push. The required status check.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ./tools/js-is-current.sh        # the committed JS matches src/
      - run: node tools/words-check.mjs      # a headline survives being split
      - run: python3 tools/icons.py          # favicon, touch icon, share image
      - run: python3 tools/vcard.py          # the saveable contact, or nothing at all
      - run: python3 tools/objects.py        # every content object is well formed
      - run: python3 tools/content-check.py  # the client's publication rules hold
      - run: python3 tools/invariants.py     # nothing that must happen once happens twice
      - uses: taiki-e/install-action@v2
        with:
          tool: zola@0.23.6
      - run: zola build

      # The only check here that runs the page rather than reading it.
      # Uses the runner's own Chrome — no dependency, nothing installed.
      - run: python3 tools/render-check.py

      # only the real deploy publishes an artifact — a PR build that
      # uploaded one would contend with an in-flight deploy
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: public

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # scoped to this job, and never cancelled: killing a deploy
    # mid-flight leaves Pages serving stale output
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
