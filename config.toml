# One page. Change the two names below and it is the client's site.
#
# Language: "en" is a placeholder guess — one line to change. To add a
# second language, uncomment the block at the bottom and run
# `zola build`; Zola then looks for content/_index.<code>.md.
default_language = "en"

# FRENCH IS NOT BUILT YET.
#
# `content/_index.fr.md` now has exactly the same fields as the English
# page — `tools/fr-check.py` compares them one by one and fails the
# build if either side gains or loses one. That comparison is new
# because its absence is how the file fell thirty-six fields behind
# before anyone noticed.
#
# What is missing now is the translation itself, not the structure. The
# page is held back twice while that is true: `draft = true` in the file
# (managed by the scaffold) and this block staying commented out. A page
# that exists and is wrong is worse than one that does not exist.
#
# Restore `[languages.fr]` when `tools/fr-check.py` reports nothing left
# to translate.
base_url = "https://bdcbqa314159.github.io/myArtisticProject"
title = "myArtisticProject"
compile_sass = false
build_search_index = false
minify_html = true


# The dossier page images are USED by the build — `resize_image` reads
# them — but the originals are not published. Everything else in
# content/ is copied into the output as it stands, and these are a
# document at 1600px: the point of a dossier is that the reader can look
# at it and not take it away. The derivatives the page shows are still
# generated and served.
#
# THE `**/` IS LOAD-BEARING. Measured: `dossier-*.jpg` and
# `content/dossier-*.jpg` both leave all three originals in the output,
# and only `**/dossier-*.jpg` removes them. A pattern that silently
# matches nothing looks exactly like one that works.
ignored_content = ["**/dossier-*.jpg"]

[markdown]
smart_punctuation = true
lazy_async_image = true

[extra]
# NOT LIVE YET. While false, the page tells search engines to stay away,
# so placeholder content misrepresents nobody. Flip when the real name
# and the real assets are both in.
live = false

author = "Bernardo Cohen"
author_url = "https://github.com/bdcbqa314159"
studio = "deLapatadaSoftware"

# French is live, not a comment. The client writes in French and the
# maquettes are in English, so both exist from the start: `en` is the
# default at /, `fr` is at /fr/. Zola builds whichever content files are
# there — content/_index.md for en, content/_index.fr.md for fr.

# ---------------------------------------------------------------
# THE BRAND ON THIS DEMO IS A STAND-IN.
#
# The client's brand is an established trademark. A public repository
# and a public Pages URL carrying it would compete with his own
# referencing for his own name — so nothing here uses it, and that
# includes the content files, which are readable on GitHub whatever the
# page renders.
#
# 10MILES is the stand-in. It is deliberately not a near-miss of the
# real mark: a name that half-matches is worse than one that does not
# match at all.
#
# The real identity, the real organisations and the real roles are
# supplied at handover, into a checkout that is not this public one.
# tools/content-check.py refuses to let them be committed here.
# ---------------------------------------------------------------
[extra.demo]
name = "10MILES"
person = "the artist"
title = "10MILES — a one-page editorial site engine"
approach_lead = "This deployment demonstrates the engine. It carries no client's name, and what follows is structure rather than anyone's portfolio."
about_lead = "The artist's own account of their practice goes here."

# Kept so `live = true` has something to resolve, and deliberately
# identical to the demo: the real values do not live in this repository.
[extra.real]
name = "10MILES"
person = "the artist"
title = "10MILES — a one-page editorial site engine"
approach_lead = "This deployment demonstrates the engine. It carries no client's name, and what follows is structure rather than anyone's portfolio."
about_lead = "The artist's own account of their practice goes here."

# The real address is supplied before launch. An empty string renders
# the contact section's own "to configure" state rather than a dead
# mailto: — the brief forbids publishing a placeholder address.
[extra.contact]
email = ""

# The saveable contact. In the moment this page is actually used — handed
# across a table at an event — the useful action is not a form that sends
# into a void, it is one that KEEPS him: a card the visitor saves to their
# phone before they put it down.
#
# Filled in at handover, like the address. While `email` is empty nothing
# is generated and nothing is offered, because a vCard with placeholder
# details is the same mistake as a placeholder mailto:.
vcard_name = ""        # "Given Family", as it should appear in a phonebook
vcard_role = ""        # "Artist & Creative Director"
vcard_org = ""         # the entity
vcard_phone = ""       # optional, international format: "+33 ..."
vcard_url = ""         # optional

# ---------------------------------------------------------------
# MENTIONS LÉGALES — required of a publisher established in France,
# whoever the audience is. Filled in at handover; the build refuses to
# go live while any of it is blank, because a legal notice with gaps in
# it is worse than an honest absence.
#
# The host's details are a fact about where the site is served and are
# filled in already.
# ---------------------------------------------------------------
# ---------------------------------------------------------------
# LET'S TALK — where the form sends.
#
# One endpoint for everybody on the service; the access key is the only
# thing that says whose inbox a message lands in. Ported from myBureau,
# which has been running it — see LICENCE §2, the engine travels with
# the Author.
#
# TWO KEYS, picked by `live`, for the same reason the identity and the
# robots policy are. A single key would mean flipping `live = true` puts
# the client's name up while his enquiries still arrive in the studio's
# inbox — silently, until somebody says they never heard back.
#
# An empty key makes the form say it is not connected rather than
# swallowing the message. The key is public by design: it lives in the
# page so the browser can submit. It is a destination, not a secret.
#
# Everything the browser checks is a courtesy — an attacker POSTs
# straight at the endpoint and none of our code runs.
# ---------------------------------------------------------------
[extra.contact_form]
endpoint = "https://api.web3forms.com/submit"

[extra.contact_form.demo]
access_key = ""        # the studio's own, while live = false

[extra.contact_form.real]
access_key = ""        # the client's own, registered by him, to his address

[extra.legal]
entity = ""            # the legal name of the publisher
status = ""            # e.g. "Entrepreneur individuel", "SASU"
registration = ""      # SIRET / RCS
address = ""           # the registered address
publisher = ""         # directeur de la publication
host_name = "GitHub, Inc."
host_address = "88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, United States"
host_url = "https://github.com"

# ---------------------------------------------------------------
# ELSEWHERE — the two the client named: LinkedIn and WhatsApp Business.
#
# `url` points at each service's own page for now — the client's call,
# and enough to show the footer working. When his LinkedIn profile and
# his WhatsApp Business number arrive, each is a one-line swap here or
# a paste into the studio panel, which can edit `url` and nothing else:
# `name` and the mark filenames are ours and are not reachable from a
# browser.
#
# `mark` and `mark_dark` are the files in static/img/brand/, downloaded
# from each owner's own brand page and used unmodified. Two of each
# because the footer has four background states and one file cannot be
# legible on all of them — both brands publish a black and a white
# variant for exactly this, so the pair is their artwork, not our
# recolour. Until the URL and both files exist the entry shows a note to
# ourselves in the footer and the gate refuses to go live. See
# static/img/brand/SOURCES.md and NOTICE.
# ---------------------------------------------------------------
[extra.social.linkedin]
name = "LinkedIn"
url = "https://www.linkedin.com"   # his profile when we have it
mark = "linkedin-black.png"      # in: the In Bug, unmodified
mark_dark = "linkedin-white.png"

[extra.social.whatsapp]
name = "WhatsApp"
url = "https://www.whatsapp.com"   # https://wa.me/<number> when we have it
mark = "whatsapp-black.svg"      # in: the Glyph, unmodified
mark_dark = "whatsapp-white.svg"
